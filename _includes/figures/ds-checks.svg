<svg class="ds-fig" viewBox="0 0 680 118" role="img" aria-label="Gemini가 만든 인자는 필수 값 확인, 요청한 user_uuid로 범위 제한, 대상 확인을 거쳐 DB에 반영되고, 값이 없거나 대상이 없으면 오류를 모델에 돌려줘 답변으로 안내하는 과정"><defs><marker id="dsc-line" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.6L7.4 4L0 7.4z" fill="#5B6C7C"/></marker><marker id="dsc-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.6L7.4 4L0 7.4z" fill="#C8342B"/></marker></defs>
